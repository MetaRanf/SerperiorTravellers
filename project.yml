name: SerperiorTravellers
options:
  bundleIdPrefix: com.serperiortravellers
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: "YES"
    CODE_SIGNING_ALLOWED: "NO"
    MARKETING_VERSION: "1.0.0"
  configs:
    Debug:
      type: debug
    Release:
      type: release

schemes:
  SerperiorTravellers:
    build:
      targets:
        SerperiorTravellers: all
    run:
      config: Debug
      executable: SerperiorTravellers
    test:
      config: Debug
      targets:
        - name: SerperiorTravellersTests
        - name: SerperiorTravellersUITests

targets:
  SerperiorTravellers:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    info:
      path: SerperiorTravellers/Resources/Info.plist
      properties:
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations: {}
        UILaunchScreen:
          UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: "Serperior Travellers uses your location to show nearby destinations and activities on the map."
        NSAccentColorName: "AccentColor"
        CFBundleDisplayName: "Serperior Travellers"
    sources:
      - path: SerperiorTravellers
        excludes:
          - "**/README.md"
          - "**/*.md"
          - "Resources/Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.serperiortravellers.app
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: "SerperiorTravellers/Resources/Info.plist"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
  SerperiorTravellersTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SerperiorTravellersTests
    dependencies:
      - target: SerperiorTravellers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.serperiortravellers.app.tests
        TARGETED_DEVICE_FAMILY: "1"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SerperiorTravellers.app/SerperiorTravellers"
        BUNDLE_LOADER: "$(TEST_HOST)"
  SerperiorTravellersUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SerperiorTravellersUITests
    dependencies:
      - target: SerperiorTravellers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.serperiortravellers.app.uitests
        TARGETED_DEVICE_FAMILY: "1"
        TEST_TARGET_NAME: SerperiorTravellers
